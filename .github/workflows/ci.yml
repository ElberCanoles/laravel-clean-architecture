name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '9.*'
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - laravel: '13'
            php: '8.2'
          # Laravel 11 never supported PHP 8.5 (official range: 8.2 - 8.4)
          - laravel: '11'
            php: '8.5'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 11 is EOL and carries unpatched security advisories, so modern
      # Composer refuses to install it. Support is deprecated and scheduled for
      # removal in v2.0 — until then this leg keeps the claim honest.
      - name: Allow EOL Laravel 11
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/pest

  lowest:
    runs-on: ubuntu-latest
    name: Prefer lowest (PHP 8.2 - Laravel 11.17)

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Allow EOL Laravel 11
        run: composer config policy.advisories.block false

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:9.*"

      - name: Install lowest dependencies
        run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable

      - name: Run tests
        run: vendor/bin/pest

  windows:
    runs-on: windows-latest
    name: Windows (PHP 8.5 - Laravel 13)

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Windows PHP builds ship these as optional DLLs (built-in on Linux):
          # flysystem-local needs fileinfo; the migration E2E test needs pdo_sqlite.
          extensions: fileinfo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (PHP 8.5 - Laravel 13)

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --min=75

  pint:
    runs-on: ubuntu-latest
    name: Code style (Pint)

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test
