name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - laravel: '13'
            php: '8.2'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  lowest:
    runs-on: ubuntu-latest
    name: Prefer lowest (PHP 8.2 - Laravel 12.0)

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:10.*"

      - name: Install lowest dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: lowest
          composer-options: --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  windows:
    runs-on: windows-latest
    name: Windows (PHP 8.5 - Laravel 13)

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # Windows PHP builds ship these as optional DLLs (built-in on Linux):
          # flysystem-local needs fileinfo; the migration E2E test needs pdo_sqlite.
          extensions: fileinfo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'

    name: Static analysis (Laravel ${{ matrix.laravel }})

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Select Laravel version
        run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Audit dependencies
        run: composer audit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  coverage:
    runs-on: ubuntu-latest
    name: Coverage (PHP 8.5 - Laravel 13)

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/pest --coverage --min=75

  pint:
    runs-on: ubuntu-latest
    name: Code style (Pint)

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

  mutation:
    # Informational: reports the mutation score on every push to main without
    # gating the build. Once the score settles, add --min=<score> to make it a gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Mutation testing (informational)
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: Run mutation testing
        run: vendor/bin/pest --mutate --parallel --everything --covered-only
