name: Bug report
description: Something the package does is broken or wrong
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.5.0"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.26"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.5.4"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code that triggers the bug
      description: The exact artisan command (with options) or the generated code involved.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full output or stack trace when relevant.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Custom stubs published? Non-default config (namespace_prefix, contexts_path, id_type)? Windows?
